<!DOCTYPE html>
<html>
    <head>
        <title>Custom</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>

    <body>
        <h1>War Wordle</h1>
        <h1>Guess the conflict</h1>
        <div class="options">
            <div id="timeSelect">
                <select id="startTimePeriodChoose">
                    <option value="AD">AD</option>
                    <option value="BC">BC</option>
                </select>
                <select id="endTimePeriodChoose">
                    <option value="A.D.">A.D.</option>
                    <option value="B.C.">B.C.</option>
                </select>
                <input type="text" placeholder="Starts from..." id="startOption">
                <input type="text" placeholder="Ends from..." id="endOption">
            </div>
            <button id="applyOptionsButton" type="button" onclick="applySettings()">Apply Settings</button>
        </div>
        <h1 id="conflictNameLine">Name of random conflict: ???</h1>
        <div class="container">
            <p class="conflictInfoBox" id="startBox">Start: {{ start | safe }}</p>
            <p class="conflictInfoBox" id="endBox">End: ???</p>
            <p class="conflictInfoBox" id="victorsBox">Victors: <br> ???</p>
            <p class="conflictInfoBox" id="defeatedBox">Defeated: <br> ???</p>
        </div>
        <div class="dropdown">
            <input type="text" placeholder="Search.." id="myInput" onkeyup="filterFunction()">
            <div id="myDropdown" class="dropdown-content">
                {% for name in conflict_names %}
                <a class="conflict-option" data-name="{{ name | e }}">{{ name | safe }}</a> 
                {% endfor %}
            </div>
        </div>

        <div class="guessBox" id="guessBox1"> </div>
        <div class="guessBox" id="guessBox2"> </div>
        <div class="guessBox" id="guessBox3"> </div>
        <div class="guessBox" id="guessBox4"> </div>
        <div class="guessBox" id="guessBox5"> </div>

        <div class="popUpNotification" id="bottomNotification">Notification here</div>

        <script src="static/custom.js"></script>
    </body>
</html>
